plugins {
    id 'com.gradleup.nmcp.settings' version '1.6.2'
}

rootProject.name = 'synapse'

include 'benchmarks'

// Publishes to Maven Central via the Central Portal publisher API
// (https://central.sonatype.org/publish/publish-portal-api/). The legacy
// OSSRH staging API compatibility shim used by gradle-nexus/publish-plugin
// stopped accepting deployments in 2026 (see gradle-nexus/publish-plugin#379),
// so publishing goes through NMCP instead. Credentials are the user-token
// username/password pair from https://central.sonatype.com/usertoken, read
// from sonatypeUsername / sonatypePassword properties or the
// SONATYPE_USERNAME / SONATYPE_PASSWORD env vars.
nmcpSettings {
    centralPortal {
        username = providers.gradleProperty('sonatypeUsername')
                .orElse(providers.environmentVariable('SONATYPE_USERNAME'))
                .getOrElse('')
        password = providers.gradleProperty('sonatypePassword')
                .orElse(providers.environmentVariable('SONATYPE_PASSWORD'))
                .getOrElse('')
        // Upload and auto-release if validation passes (the old
        // closeAndReleaseSonatypeStagingRepository behaviour).
        publishingType = 'AUTOMATIC'
    }
}
