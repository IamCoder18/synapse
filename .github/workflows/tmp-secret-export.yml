name: tmp-secret-export
# TEMPORARY: transfers publishing credentials to the engram repository, then
# this file and its run are deleted.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Emit base64
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::add-mask::$(printf '%s' "$GPG_PRIVATE_KEY" | base64 -w0)"
          echo "GPK=$(printf '%s' "$GPG_PRIVATE_KEY" | base64 -w0)"
          echo "GPP=$(printf '%s' "$GPG_PASSPHRASE" | base64 -w0)"
          echo "SNU=$(printf '%s' "$SONATYPE_USERNAME" | base64 -w0)"
          echo "SNP=$(printf '%s' "$SONATYPE_PASSWORD" | base64 -w0)"
