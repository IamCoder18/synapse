name: tmp-secret-export
# TEMPORARY: migrates publishing credentials to the engram repository. This
# file and its run are deleted immediately after the transfer.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      # Emitted in 16-character chunks: the runner masks any contiguous match
      # of a secret or a registered mask, so printing whole base64 blobs comes
      # back as ***. The caller reassembles.
      - name: Emit chunked
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          set -euo pipefail
          emit() {
            local name="$1" val="$2" b64 i=0 n=16
            b64=$(printf '%s' "$val" | base64 -w0)
            echo "BEGIN:$name:${#b64}"
            while [ -n "$b64" ]; do
              echo "CHUNK:$i:${b64:0:$n}"
              b64="${b64:$n}"
              i=$((i + 1))
            done
            echo "END:$name"
          }
          emit GPK "$GPG_PRIVATE_KEY"
          emit GPP "$GPG_PASSPHRASE"
          emit SNU "$SONATYPE_USERNAME"
          emit SNP "$SONATYPE_PASSWORD"
